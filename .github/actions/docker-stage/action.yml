name: Build a Docker stage
description: >-
  Build a docker/Dockerfile stage with the settings the GitHub Actions layer
  caches are keyed on, so every job reads and writes the same cache entries.

inputs:
  target:
    description: Dockerfile stage to build.
    required: true
  build-args:
    description: Extra build arguments, one per line.
    default: ''
  cache-from:
    description: >-
      Layer caches to read, one per line. Never list two caches that hold the
      same layers: BuildKit then misses the later stages at random.
    default: ''
  cache-to:
    description: Layer cache to write.
    default: ''
  allow:
    description: Extra privileges for RUN steps.
    default: ''
  compiler-cache:
    description: >-
      Actions cache key prefix for the stage's ccache directory, which the
      build gets as the `compiler_cache` build context (empty until a save).
      Pushes and manual runs build `<target>_compiler_cache` instead of
      `target` and save it under the prefix; other events only read.
    default: ''
  submodules:
    description: Check out the submodules, skipping unused test data.
    default: 'false'
  setup:
    description: Set up Buildx (and the submodules); true for the first build in each job.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check out submodules
      if: inputs.setup == 'true' && inputs.submodules == 'true'
      shell: bash
      run: |
        git config --global submodule.LegacyTests.update none
        git config --global submodule.third_party/tests.update none
        git submodule init
        git submodule status | awk '{ print $2 }' |
          xargs -P 0 -n 1 git submodule update --init --recursive --depth=1 --

    - name: Set up Docker Buildx
      if: inputs.setup == 'true'
      uses: docker/setup-buildx-action@v4
      with:
        cleanup: false

    - name: Read toolchain versions
      id: toolchain
      shell: bash
      run: |
        source scripts/ubuntu-build/toolchain.env
        echo "gcc=$GCC_VERSION" >> "$GITHUB_OUTPUT"
        echo "llvm=$LLVM_VERSION" >> "$GITHUB_OUTPUT"

    - name: Restore compiler cache
      if: inputs.compiler-cache != ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/compiler_cache
        key: ${{ inputs.compiler-cache }}-${{ github.sha }}
        restore-keys: ${{ inputs.compiler-cache }}-

    # The build reads the restored cache from compiler_cache.in. A save
    # exports the new one to the path the restore step used, because
    # actions/cache keys its entries on the path too.
    - name: Prepare compiler cache
      id: ccache
      if: inputs.compiler-cache != ''
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        mkdir -p "$RUNNER_TEMP/compiler_cache"
        mv "$RUNNER_TEMP/compiler_cache" "$RUNNER_TEMP/compiler_cache.in"
        echo "contexts=compiler_cache=$RUNNER_TEMP/compiler_cache.in" >> "$GITHUB_OUTPUT"
        if [[ "$GITHUB_EVENT_NAME" == push ||
              "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
          echo "target=${TARGET}_compiler_cache" >> "$GITHUB_OUTPUT"
          echo "outputs=type=local,dest=$RUNNER_TEMP/compiler_cache" >> "$GITHUB_OUTPUT"
        fi

    - name: Build `${{ inputs.target }}` stage
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: false
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: docker/Dockerfile
        build-args: |-
          UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu/
          GCC_VERSION=${{ steps.toolchain.outputs.gcc }}
          LLVM_VERSION=${{ steps.toolchain.outputs.llvm }}
          ${{ inputs.build-args }}
        build-contexts: ${{ steps.ccache.outputs.contexts }}
        allow: ${{ inputs.allow }}
        ulimit: "memlock=-1:-1"
        target: ${{ steps.ccache.outputs.target || inputs.target }}
        outputs: ${{ steps.ccache.outputs.outputs }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}

    - name: Save compiler cache
      if: steps.ccache.outputs.outputs != ''
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/compiler_cache
        key: ${{ inputs.compiler-cache }}-${{ github.sha }}
