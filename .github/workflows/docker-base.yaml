name: Docker Base Image

on:
  push:
    branches: ["main"]
    paths:
      - '.github/actions/docker-stage/**'
      - 'docker/Dockerfile'
      - 'scripts/ubuntu-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-base:
    runs-on: ubuntu-26.04-32

    steps:
      - uses: actions/checkout@v4

      - name: Build and cache `base` stage
        uses: ./.github/actions/docker-stage
        with:
          target: base
          cache-to: type=gha,scope=base
          submodules: false

      - name: Build and cache `base_rust` stage
        uses: ./.github/actions/docker-stage
        with:
          target: base_rust
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base_rust
          setup: false
