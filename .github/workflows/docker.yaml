name: Docker

on:
  push:
    branches: ["main"]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  toolchain:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      gcc: ${{ steps.versions.outputs.gcc }}
      llvm: ${{ steps.versions.outputs.llvm }}

    steps:
      - uses: actions/checkout@v7

      - id: versions
        run: |
          source scripts/ubuntu-build/toolchain.env
          echo "gcc=$GCC_VERSION" >> "$GITHUB_OUTPUT"
          echo "llvm=$LLVM_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.CMAKE_BUILD_TYPE }}, ${{ matrix.compiler.name }})
    needs: toolchain
    strategy:
      matrix:
        CMAKE_BUILD_TYPE: [RelWithDebInfo, Debug]
        compiler:
          - name: gcc
            CXX: g++-${{ needs.toolchain.outputs.gcc }}
            CC: gcc-${{ needs.toolchain.outputs.gcc }}
          - name: clang
            CXX: clang++-${{ needs.toolchain.outputs.llvm }}
            CC: clang-${{ needs.toolchain.outputs.llvm }}

    runs-on: ubuntu-26.04-32
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Reserve hugepages
        run: |
          hugepages=/sys/devices/system/node/node0/hugepages
          echo 2048 | sudo tee $hugepages/hugepages-2048kB/nr_hugepages
          echo 8 | sudo tee $hugepages/hugepages-1048576kB/nr_hugepages
          cat $hugepages/hugepages-*/nr_hugepages

      - name: Build `build_and_test` stage
        uses: ./.github/actions/docker-stage
        with:
          target: build_and_test
          setup: true
          submodules: true
          build-args: |
            CC=${{ matrix.compiler.CC }}
            CXX=${{ matrix.compiler.CXX }}
            CMAKE_BUILD_TYPE=${{ matrix.CMAKE_BUILD_TYPE }}
            TOOLCHAIN=gcc-avx2
          allow: security.insecure # for tests which use io_uring
          cache-from: |
            type=gha,scope=base
            type=gha,scope=test_fixtures
