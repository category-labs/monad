name: ZK Tests

on:
  push:
    branches: ["main"]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Compile for RISC-V
    runs-on: ubuntu-26.04-32
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Build `build_zk` stage
        uses: ./.github/actions/docker-stage
        with:
          target: build_zk
          setup: true
          submodules: true
          cache-from: |
            type=gha,scope=riscv-toolchain
            type=gha,scope=base
