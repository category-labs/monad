name: ZK Tests

on:
  push:
    branches: ["main"]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >
    ${{
      (github.event_name == 'push' && format('push-{0}-zk-tests', github.ref))
      || (github.event_name == 'pull_request' && format('pr-{0}-zk-tests', github.event.pull_request.number))
      || (github.event_name == 'workflow_dispatch' && format('workflow-dispatch-{0}-zk-tests', github.run_id))
      || format('{0}-zk-tests', github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
      name: Compile for RISC-V
      runs-on: ubuntu-26.04-32
      steps:
      - name: Configure git submodules
        run: |
          git config --global submodule.fetchJobs "$(nproc)"
          git config --global submodule.LegacyTests.update none
          git config --global submodule.third_party/tests.update none

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build `build_zk` stage
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          build-args: |-
            UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu/
          ulimit: "memlock=-1:-1"
          target: build_zk
          cache-from: |
            type=gha,scope=riscv-toolchain
            type=gha,scope=base
