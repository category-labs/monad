[package]
name = "monad-exec-events"
description = "Rust API for consuming execution events"
version = "0.1.0"
edition = "2021"

[dependencies]
monad-event-ring = { workspace = true }

alloy-consensus = { workspace = true, optional = true }
alloy-eips = { workspace = true, optional = true }
alloy-primitives = { workspace = true, optional = true }
alloy-rpc-types = { workspace = true, optional = true }
itertools = { workspace = true }
serde = { workspace = true, features = ["derive"] }
strum = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

[build-dependencies]
monad-build = { workspace = true, features = ["bindgen-static"] }

[dev-dependencies]
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
criterion = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
include_dir = { workspace = true }
k256 = { workspace = true }
lazy_static = { workspace = true }
libtest-mimic = { workspace = true }
monad-ethcall = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }

[features]
default = []
alloy = ["dep:alloy-consensus", "dep:alloy-eips", "dep:alloy-primitives", "dep:alloy-rpc-types"]

[[bench]]
name = "snapshot_exec"
harness = false

[[test]]
name = "monad_exec_events_ethereum_tests"
path = "test/ethereum_tests.rs"
harness = false
required-features = ["alloy"]
