# OpenVM app VM configuration for the monad guest.
#
# This is byte-for-byte the config that `SdkVmConfig::standard()` builds
# (crates/sdk-config/src/openvm_standard.toml in openvm v2.0.1) — the monad
# guest's precompile set needs exactly the standard extension set, so there is
# no reason to hand-roll one. Keeping them identical means the host driver can
# use `SdkVmConfig::standard()` directly and stay in sync by construction.
#
# Consumed by `cargo openvm build`, which also generates the openvm_init.rs
# that `openvm::init!()` includes. Two traps to respect when editing:
#
#  - The order of `modular.supported_moduli` and `ecc.supported_curves` defines
#    the setup indices baked into openvm_init.rs. Reordering silently changes
#    which modulus an accelerated op uses.
#  - `SdkVmConfig` deserializes with serde's default unknown-field handling, so
#    a misspelled extension key is *silently dropped* rather than rejected —
#    the extension is then simply absent and its ops trap at runtime. Spell
#    them exactly: `keccak`, `sha2`, `bigint`, `modular`, `fp2`, `pairing`,
#    `ecc`, `rv32i`, `rv32m`, `io`.
#
# Both bins in this package share this file: `openvm::init!()` expands to an
# include of `$CARGO_MANIFEST_DIR/openvm_init.rs`, and `cargo openvm build`
# writes that file into the package directory, so there is exactly one config
# per package regardless of which bin is being built.
#
# The `[app_vm_config.system]` table is deliberately absent, which selects the
# default SystemConfig. It cannot be given *partially*: `SdkVmConfig` defaults
# the whole `system` field, but `SystemConfig` itself declares no per-field
# serde defaults, so naming the table obliges you to spell out
# `max_constraint_degree` and the entire `memory_config` (every address space)
# as well. Override it on the host instead — see `num_public_values` in the
# README's constraints section, which the precompile-test guest's failure log
# needs raised.

