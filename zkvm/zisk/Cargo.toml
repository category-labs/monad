[package]
name = "monad-zkvm-zisk"
description = "Monad witness executor and embedded guest for the ZisK zkVM"
version = "0.1.0"
edition = "2021"

# Isolate the ZisK host/guest dependency graph from the main Rust workspace.
[workspace]
resolver = "2"

[features]
# Select the RISC-V entry point when invoking cargo-zisk directly.
guest = []

[[bin]]
name = "monad-zkvm-zisk"
path = "src/main.rs"
required-features = ["guest"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(not(all(target_os = "zkvm", target_vendor = "zisk")))'.dependencies]
zisk-sdk = "=1.3.2-alpha"

[target.'cfg(all(target_os = "zkvm", target_vendor = "zisk"))'.dependencies]
ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v1.3.2-alpha" }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
sha2 = { version = "0.10", default-features = false }
ripemd = { version = "0.1", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

substrate-bn = "0.6"
aurora-engine-modexp = "1.2"
kzg-rs = { git = "https://github.com/succinctlabs/kzg-rs.git" }

[target.'cfg(not(all(target_os = "zkvm", target_vendor = "zisk")))'.build-dependencies]
monad-zkvm-build-support = { path = "../build-support", features = ["zisk-host"] }

[target.'cfg(all(target_os = "zkvm", target_vendor = "zisk"))'.build-dependencies]
monad-zkvm-build-support = { path = "../build-support" }
